<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b16"><title>閃身步：彈幕生存</title>
<style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b16;color:#eafaff;font-family:system-ui,sans-serif}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.box{background:#0b1426dd;border:1px solid #6ef7ff66;border-radius:12px;padding:8px 10px;font-size:11px;color:#9bb4d2}.num{font-size:20px;font-weight:900;color:#6ef7ff}.gold{color:#ffd166}.controls{position:absolute;bottom:20px;left:18px;right:18px;display:flex;justify-content:space-between}.btn{height:60px;min-width:68px;border:1px solid #6ef7ff77;border-radius:16px;background:#10233ddd;color:white;font-weight:900;font-size:20px}.dash{background:#45152cdd;border-color:#ff4f9a99;font-size:14px}.overlay{position:absolute;inset:0;background:#050914bb;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(420px,100%);background:#111d33;border:1px solid #6ef7ff66;border-radius:22px;padding:25px;text-align:center;box-shadow:0 0 45px #00d9ff22}.kicker{color:#6ef7ff;font-size:11px;letter-spacing:4px}h1{font-size:42px;margin:10px}.sub{color:#b7c9e0;font-size:14px;line-height:1.7}.primary{width:100%;margin-top:18px;padding:15px;border:0;border-radius:13px;background:linear-gradient(90deg,#53e8f7,#a5fff1);font-size:17px;font-weight:900;color:#071321}.small{font-size:11px;color:#8299b9;line-height:1.7;margin-top:14px}#over{display:none}
</style></head><body><canvas id="c"></canvas>
<div class="hud"><div class="box">本局分數<div class="num" id="score">000000</div></div><div class="box">生存時間<div class="num" id="time">0.0s</div></div><div class="box">最高分<div class="num gold" id="best">000000</div></div></div>
<div class="controls"><div><button class="btn" id="left">◀</button> <button class="btn" id="right">▶</button></div><button class="btn dash" id="dash">閃身步<br><small id="cd">就緒</small></button></div>
<div class="overlay" id="start"><div class="card"><div class="kicker">DODGE • SURVIVE • SCORE</div><h1>閃身步</h1><div class="sub">彈幕生存高分挑戰<br>撐越久，敵人攻勢越猛烈。<br>閃避紅色彈幕，收集金色能量。</div><p>個人最高分：<b class="gold" id="startbest">0</b></p><button class="primary" id="play">開始挑戰</button><div class="small">手機：按住左右鍵移動，也可在畫面拖曳角色。<br>閃身步短暫無敵，冷卻 3 秒。最多承受 3 次命中。<br>最高分保存在這台裝置的瀏覽器。</div></div></div>
<div class="overlay" id="over"><div class="card"><div class="kicker">RUN COMPLETE</div><h1>挑戰結束</h1><div class="sub" id="msg">再試一次！</div><p>本局：<b id="final">0</b>　生存：<b id="ftime">0s</b></p><p>最高：<b class="gold" id="fbest">0</b></p><button class="primary" id="again">再挑戰一次</button><button class="primary" style="background:#152844;color:#eafaff" id="home">回主畫面</button></div></div>
<script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),$=s=>document.getElementById(s);let w,h,d=1,run=false,last=0,t=0,score=0,best=0,hp=3,p,bul=[],fx=[],orbs=[],spawn=.3,orbtime=5,cd=0,inv=0,L=false,R=false,drag=false,ptr=false,shake=0,streak=0,streaktime=0;
try{best=+localStorage.getItem('shanshenbu_best')||0}catch(e){}function fmt(n){return Math.floor(n).toString().padStart(6,'0')}function size(){w=c.clientWidth;h=c.clientHeight;d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);if(p)p.y=h*.77}onresize=size;size();
function reset(){t=score=0;hp=3;bul=[];fx=[];orbs=[];spawn=.25;orbtime=5;cd=inv=shake=streak=streaktime=0;p={x:w/2,y:h*.77,r:12,speed:w*.65};$('score').textContent=fmt(0);$('time').textContent='0.0s'}
function start(){reset();run=true;$('start').style.display='none';$('over').style.display='none';last=performance.now();requestAnimationFrame(loop)}
function end(){run=false;if(score>best){best=score;try{localStorage.setItem('shanshenbu_best',best)}catch(e){}}$('best').textContent=fmt(best);$('startbest').textContent=fmt(best);$('final').textContent=fmt(score);$('ftime').textContent=t.toFixed(1)+'s';$('fbest').textContent=fmt(best);$('msg').textContent=score>=best?'新紀錄！':'掌握節奏，再挑戰一次！';$('over').style.display='flex'}
$('play').onclick=start;$('again').onclick=start;$('home').onclick=()=>{$('over').style.display='none';$('start').style.display='flex'};
function hold(id,side){let el=$(id);function down(e){e.preventDefault();if(side==='l')L=true;else R=true;el.style.transform='translateY(3px)'}function up(e){if(side==='l')L=false;else R=false;el.style.transform=''}el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(k=>el.addEventListener(k,up))}hold('left','l');hold('right','r');
function dash(e){if(e)e.preventDefault();if(!run||cd>0)return;cd=3;inv=.7;burst(p.x,p.y,'#6ef7ff',16)}$('dash').addEventListener('pointerdown',dash);
onkeydown=e=>{if(['ArrowLeft','ArrowRight',' ','a','d'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')L=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')R=true;if(e.key===' ')dash();if(!run&&e.key==='Enter')start()};onkeyup=e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')L=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')R=false};
function move(px){p.x=Math.max(18,Math.min(w-18,px))}c.onpointerdown=e=>{if(!run)return;ptr=drag=true;move(e.clientX-c.getBoundingClientRect().left)};c.onpointermove=e=>{if(run&&ptr)move(e.clientX-c.getBoundingClientRect().left)};onpointerup=()=>{ptr=drag=false};
function shot(a,b,vx,vy,col='#ff4f9a',r=5){bul.push({x:a,y:b,vx,vy,col,r})}function pattern(){let cx=w/2,k=Math.random(),n=Math.min(11,4+(t/12|0)),target=p.x;if(k<.25){let gap=w/(n+1);for(let i=1;i<=n;i++)if(Math.random()<.83)shot(i*gap,-8,(target-i*gap)*.12,120+Math.random()*30)}else if(k<.5){let xx=30+Math.random()*(w-60);for(let i=-2;i<=2;i++)shot(xx,-10,i*40,125+Math.abs(i)*8,'#ff795e')}else if(k<.75){for(let i=0;i<7;i++){let a=(i-3)*.23+(target-cx)*.001;shot(cx,-8,Math.sin(a)*195,Math.cos(a)*155,'#ff6ab5')}}else{let xx=Math.random()<.5?w*.28:w*.72;for(let i=0;i<5;i++)shot(xx+(Math.random()-.5)*28,-i*26,(target-xx)*.06,150,'#ffb454',4.5)}}
function burst(a,b,col,n=8){for(let i=0;i<n;i++){let z=Math.random()*Math.PI*2,s=40+Math.random()*140;fx.push({x:a,y:b,vx:Math.cos(z)*s,vy:Math.sin(z)*s,life:.3+Math.random()*.4,col,r:2+Math.random()*2})}}
function update(dt){t+=dt;score+=dt*(12+Math.min(25,t*.35));cd=Math.max(0,cd-dt);inv=Math.max(0,inv-dt);$('cd').textContent=cd?cd.toFixed(1)+'s':'就緒';if(!drag){if(L)p.x-=p.speed*dt*(1+Math.min(.5,t/130));if(R)p.x+=p.speed*dt*(1+Math.min(.5,t/130))}p.x=Math.max(18,Math.min(w-18,p.x));spawn-=dt;if(spawn<=0){pattern();spawn=Math.max(.22,.82-t*.006)*(.75+Math.random()*.4)}orbtime-=dt;if(orbtime<=0){orbs.push({x:25+Math.random()*(w-50),y:-10,r:8,vy:90+t*1.2,a:0});orbtime=7+Math.random()*5}
for(let i=bul.length-1;i>=0;i--){let b=bul[i];b.x+=b.vx*dt*(1+t*.003);b.y+=b.vy*dt*(1+t*.004);if(b.y>h+30||b.x<-40||b.x>w+40){bul.splice(i,1);continue}let dist=Math.hypot(b.x-p.x,b.y-p.y),hit=b.r+p.r;if(dist<hit+17&&dist>=hit&&inv<=0&&streaktime<=0){streak++;streaktime=.7;score+=30+streak*7;burst(p.x,p.y,'#ffd166',3)}if(dist<hit&&inv<=0){hp--;inv=1;shake=10;burst(p.x,p.y,'#ff4f9a',15);bul.splice(i,1);if(hp<=0){end();return}}}
for(let i=orbs.length-1;i>=0;i--){let o=orbs[i];o.y+=o.vy*dt;o.a+=dt*3;if(Math.hypot(o.x-p.x,o.y-p.y)<o.r+p.r+3){score+=250;burst(o.x,o.y,'#ffd166',15);orbs.splice(i,1)}else if(o.y>h+20)orbs.splice(i,1)}
streaktime=Math.max(0,streaktime-dt);if(!streaktime)streak=0;for(let i=fx.length-1;i>=0;i--){let f=fx[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.pow(.04,dt);f.vy*=Math.pow(.04,dt);f.life-=dt;if(f.life<=0)fx.splice(i,1)}shake=Math.max(0,shake-dt*25);$('score').textContent=fmt(score);$('time').textContent=t.toFixed(1)+'s'}
function draw(){x.clearRect(0,0,w,h);x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);let hz=h*.2;x.strokeStyle='#48c9ed1c';for(let i=0;i<14;i++){let y=hz+(i*45+t*65)%(h-hz);x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}for(let i=0;i<12;i++){let xx=i*w/11;x.beginPath();x.moveTo(w/2+(xx-w/2)*.15,hz);x.lineTo(xx,h);x.stroke()}
for(let o of orbs){x.save();x.translate(o.x,o.y);x.rotate(o.a);x.shadowBlur=16;x.shadowColor='#ffd166';x.strokeStyle='#ffd166';x.lineWidth=2;x.beginPath();x.moveTo(0,-o.r);x.lineTo(o.r,0);x.lineTo(0,o.r);x.lineTo(-o.r,0);x.closePath();x.stroke();x.restore()}
for(let b of bul){x.save();x.shadowBlur=13;x.shadowColor=b.col;x.fillStyle=b.col;x.beginPath();x.arc(b.x,b.y,b.r,0,6.283);x.fill();x.restore()}for(let f of fx){x.globalAlpha=Math.max(0,f.life*2);x.fillStyle=f.col;x.beginPath();x.arc(f.x,f.y,f.r,0,6.283);x.fill()}x.globalAlpha=1;
if(p){x.save();x.translate(p.x,p.y);x.shadowBlur=inv?25:12;x.shadowColor='#6ef7ff';if(inv){x.strokeStyle='#6ef7ff99';x.beginPath();x.arc(0,0,p.r+9+Math.sin(t*22)*2,0,6.283);x.stroke()}x.strokeStyle='#8cfaff';x.lineWidth=3;x.beginPath();x.arc(0,-12,6,0,6.283);x.moveTo(0,-5);x.lineTo(0,12);x.moveTo(0,0);x.lineTo(-11,7);x.moveTo(0,0);x.lineTo(11,7);x.moveTo(0,12);x.lineTo(-8,23);x.moveTo(0,12);x.lineTo(8,23);x.stroke();x.restore()}
for(let i=0;i<hp;i++){let xx=w/2+(i-1)*22,yy=h-103;x.fillStyle='#ff4f9a';x.beginPath();x.arc(xx-4,yy,5,Math.PI,0);x.arc(xx+4,yy,5,Math.PI,0);x.lineTo(xx,yy+11);x.fill()}if(streak>1&&run){x.textAlign='center';x.font='bold 13px system-ui';x.fillStyle='#ffd166';x.fillText('閃避連擊 ×'+streak,w/2,h*.18)}x.restore()}
function loop(now){if(!run)return;let dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw();if(run)requestAnimationFrame(loop)}function idle(){if(!run){draw();requestAnimationFrame(idle)}}p={x:w/2,y:h*.77,r:12,speed:w*.65};$('best').textContent=fmt(best);$('startbest').textContent=fmt(best);draw();idle()})();
</script></body></html>
